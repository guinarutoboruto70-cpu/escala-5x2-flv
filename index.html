<header style="display:flex;justify-content:space-between;align-items:center"><div><h1 id="tituloApp">🥬 Escala 5x2</h1><small id="subtituloApp">Folgas de domingo e da semana</small><div class="hc">Desenvolvido por <b>William Jesus</b><br>© 2026 · Todos os direitos reservados</div></div><div style="display:flex;gap:8px;align-items:center"><button id="sr" class="sec" onclick="sair()" style="display:none;font-size:14px;padding:8px 12px">🚪 Sair</button><button id="tm" class="sec" onclick="tema()" style="font-size:20px;padding:6px 12px"></button></div></header>

<main id="app"></main>
<script>
let ENTROU=false,SV=-2,INV=false; // SV: semana em exibição (-1 = ciclo todo) // tela de entrada (sem senha) a cada abertura
// ===== PARÂMETROS =====
// Peso de cada dia (Seg..Sex): quanto maior, menos folgas o app coloca nesse dia.
const W=[3,1,4,1,1]; // Seg 3, Ter 1, Qua 4 (quarta verde), Qui 1, Sex 1
const START='2026-11-23'; // início do regime 5x2 (1ª segunda-feira)
const KEY0='escala5x2_flv_v1',KEYG='escala5x2_flv_v1_gerente';let KEY=KEY0;const OLD='escala_domingo_flv_v1',CLOUD='https://escala-atacadao--escalaflv.replit.app/api/state';
const NOMES=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const S0=()=>({colabs:[],grid:{},inicio:'2026-11-23',semanas:5,inv:'',tema:'',cap:[3,3,3,4,4],alvoA:[0,3,3,0,0],capv:2,seed:0,edita:false,prev:'',filtro:'Todos',edit:null,tab:'escala',historico:[],perfil:'',setor:'',perfilTemp:''});let S=S0();
if(S.capv!==2){S.cap=[3,3,3,4,4];S.capv=2} // novos limites: 3 por dia, Qui/Sex até 4
const save=()=>{if(!S.perfil)return;try{localStorage.setItem(KEY,JSON.stringify({colabs:S.colabs,grid:S.grid,inicio:S.inicio,semanas:S.semanas,inv:S.inv,tema:S.tema,cap:S.cap,alvoA:S.alvoA,historico:S.historico||[],perfil:S.perfil||'',setor:S.setor||'',capv:S.capv}))}catch(e){}};
const dt=s=>new Date(s+'T12:00:00');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((dt(a)-dt(b))/864e5);
const br=s=>s.slice(8)+'/'+s.slice(5,7);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ord=(a,b)=>(b.cargo==='Encarregado')-(a.cargo==='Encarregado')||a.nome.localeCompare(b.nome,'pt-BR');
const domOff=(c,dom)=>((Math.round(diff(dom,c.pd)/7)%2)+2)%2===0; // domingos alternados a partir do 1º domingo de folga
const dias=()=>Array.from({length:7*S.semanas},(_,i)=>add(S.inicio,i));

// ===== MOTOR DA ESCALA =====
const g$=id=>document.getElementById(id);
const isInv=seg=>!!S.inv&&diff(seg,S.inv)%14===0; // a cada 2 segundas
const confEnc=c=>c.cargo==='Encarregado'&&c.pd?S.colabs.find(x=>x.id!==c.id&&x.cargo==='Encarregado'&&x.pd&&Math.round(diff(x.pd,c.pd)/7)%2===0):null;
const msgEnc=(c,o)=>'O DSR de '+c.nome+' cairia no mesmo domingo do encarregado '+o.nome+'. Os encarregados não podem folgar no mesmo domingo: escolha o domingo seguinte ou o anterior.';
const fd=c=>c.fd!==undefined&&c.fd!==''?+c.fd:(c.fixa?0:-1); // folga fixa da semana (0=Seg..4=Sex, -1=nenhuma)
const hs=t=>{let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)};
const fdOpts=c=>['Nenhuma',...NOMES.slice(0,5)].map((n,i)=>`<option value="${i?i-1:''}"${(i?i-1:-1)===fd(c)?' selected':''}>${n}</option>`).join('');
const ultF=c=>[c.ult,c.ultd].filter(Boolean).sort().pop()||''; // a folga mais recente antes do início (semana ou DSR)
const refDom=()=>add(START,6); // primeiro domingo da escala (ex.: 29/11)
const domSel=c=>!c.pd?'':(((Math.round(diff(c.pd,refDom())/7)%2)+2)%2===0?'dsr':'trab');
const domPd=v=>v==='dsr'?refDom():v==='trab'?add(refDom(),7):'';
const domOpts=c=>[['','— Nenhum —'],['trab','Trabalha'],['dsr','DSR (folga)']].map(([v,t])=>`<option value="${v}"${domSel(c)===v?' selected':''}>${t}</option>`).join('');
const vis=()=>S.colabs.filter(c=>S.filtro==='Todos'||c.turno===S.filtro);
const marca=(c,d)=>{const g=S.grid[c.id]||{};return Object.keys(g).length?(g[d]||'T'):(g[d]||'')};
const nomeColab=c=>c.nome+(S.perfil==='gerente'&&c.setor?' · '+c.setor:'');
function gerar(only,outra){
  if(g$('i_inv'))S.inv=g$('i_inv').value;
  for(let i=0;i<5;i++){if(g$('cap'+i)&&g$('cap'+i).value!=='')S.cap[i]=Math.max(0,+g$('cap'+i).value);if(g$('alvoA'+i)&&g$('alvoA'+i).value!=='')S.alvoA[i]=Math.max(0,+g$('alvoA'+i).value);else if(g$('alvoA'+i))S.alvoA[i]=0}
  if(dt(S.inicio).getDay()!==1){alert('O início precisa ser uma segunda-feira.');return}
  if(!S.colabs.length){alert('Cadastre ou importe os colaboradores.');return}
  if(!only){
    for(const c of S.colabs){const o=confEnc(c);if(o){alert(msgEnc(c,o));return}}
    if(!S.colabs.some(c=>c.pd)){alert('Marque quem trabalha e quem fica de DSR no domingo '+br(refDom())+' (botão Domingo).');return}
    if(S.inicio>START&&!outra&&!S.colabs.some(c=>[1,2,3,4,5,6,7].some(i=>(S.grid[c.id]||{})[add(S.inicio,-i)]))&&!confirm('O mês anterior ainda não foi gerado. O app segue a escala anterior para calcular as folgas. Gerar mesmo assim?'))return;
  }
  const cs=S.colabs.filter(c=>c.pd);
  const alvo=only?cs.filter(c=>c.id===only):cs;
  if(!only)S.prev=JSON.stringify(S.grid);
  S.avisos=only?(S.avisos||[]):[];
  for(let w=0;w<S.semanas;w++){
    const seg=add(S.inicio,7*w),dom=add(seg,6),inv=isInv(seg),load={Abertura:[0,0,0,0,0],Fechamento:[0,0,0,0,0]};
    alvo.forEach(c=>{S.grid[c.id]=S.grid[c.id]||{}});
    const resetSem=()=>{alvo.forEach(c=>{for(let i=0;i<7;i++)delete S.grid[c.id][add(seg,i)]});load.Abertura=[0,0,0,0,0];load.Fechamento=[0,0,0,0,0];cs.forEach(c=>{const g=S.grid[c.id]||{};for(let i=0;i<5;i++)if(g[add(seg,i)])load[c.turno][i]++})};
    const en=alvo.filter(c=>c.cargo==='Encarregado'),fx=alvo.filter(c=>fd(c)>=0&&c.cargo!=='Encarregado'),ot=alvo.filter(c=>fd(c)<0&&c.cargo!=='Encarregado'),r=w%(ot.length||1);
    // ordem de escolha: quem trabalha o domingo (2 folgas) escolhe primeiro; nas tentativas extras a ordem varia
    const ordem=t=>[...en,...fx,...[...ot.slice(r),...ot.slice(0,r)].sort((a,b)=>(domOff(a,dom)?1:0)-(domOff(b,dom)?1:0)||(t?hs(a.id+w+t+S.seed)-hs(b.id+w+t+S.seed):0))];
    const excesso=()=>{let e=0;['Abertura','Fechamento'].forEach(t=>{for(let i=0;i<5;i++){const n=cs.filter(c=>c.turno===t&&(S.grid[c.id]||{})[add(seg,i)]==='F').length;e+=Math.max(0,n-S.cap[i])}});for(let i=0;i<5;i++){const alvo=+S.alvoA[i]||0;if(alvo){const n=cs.filter(c=>c.turno==='Abertura'&&(S.grid[c.id]||{})[add(seg,i)]==='F').length;e+=Math.abs(n-alvo)*100}}return e};
    const atribui=c=>{
      const g=S.grid[c.id],sun=domOff(c,dom),k=sun?1:2;
      let last=null;
      for(let i=1;i<=7;i++)if(g[add(seg,-i)]){last=-i;break}
      const uf=ultF(c);if(last===null&&uf){const d=diff(uf,seg);if(d<0&&d>=-14)last=d} // última folga antes do início (escala 6x1 anterior)
      if(last===null)last=domOff(c,add(seg,-1))?-1:-3;
      const cand=[];
      for(let a=0;a<5;a++){if(k===1)cand.push([a]);else for(let b=a+2;b<5;b++)cand.push([a,b])}
      const ok=o=>{let p=last;for(const q of sun?[...o,6]:o){
        if(q-p-1>5)return false;
        if(q-p<2&&!(fd(c)===0&&q===0&&p===-1))return false;
        p=q}return true};
      const outros=cs.filter(x=>x.cargo==='Encarregado'&&x.id!==c.id); // encarregados nunca folgam no mesmo dia
      const base=cand.filter(o=>(fd(c)<0||o.includes(fd(c)))&&(c.cargo!=='Encarregado'||o.every(i=>!outros.some(x=>(S.grid[x.id]||{})[add(seg,i)]))));
      // Folgas fixas entram na contagem. Não ultrapassa a meta da Abertura
      // (terça/quarta) nem o limite do dia, salvo quando a própria folga é fixa.
      const limite=o=>o.every(i=>{const alvo=c.turno==='Abertura'?(+S.alvoA[i]||0):0;const lim=alvo||S.cap[i];return load[c.turno][i]+1<=lim||fd(c)===i});
      let pool=base.filter(o=>limite(o)&&ok(o));
      if(!pool.length){S.avisos.push(c.nome+': sem opção que cumpra todas as regras na semana de '+br(seg));pool=base.filter(ok);if(!pool.length)pool=base.length?base:cand}
      const cost=o=>o.reduce((s,i)=>s+(load[c.turno][i]+1)*W[i]*(inv&&i<2?3:1)+(load[c.turno][i]>=S.cap[i]?1000:0)+(load[c.turno][i]>=Math.min(3,S.cap[i])?20:0)+((c.turno==='Abertura'&&+S.alvoA[i]&&load[c.turno][i]>=+S.alvoA[i])?80:0),0)+(sun?0:(4-o[o.length-1])*1.5)+(S.seed?(hs(c.id+w+o.join()+S.seed)%300)/100:0); // limite por dia + inventário + 2ª folga mais tarde (dá folga de encaixe na semana seguinte) + variação
      // segue a lógica da escala anterior: repete as folgas de 2 semanas atrás (mesmo ciclo de domingo), se ainda forem válidas
      const ant=[0,1,2,3,4].filter(i=>g[add(seg,i-14)]==='F');
      const rep2=!(outra&&w<2)&&ant.length===k&&pool.find(o=>o.join()===ant.join())&&ant.every(i=>load[c.turno][i]<S.cap[i]||i===fd(c))?ant:null;
      const best=rep2||pool.reduce((a,b)=>cost(b)<cost(a)?b:a);
      best.forEach(i=>{g[add(seg,i)]='F';load[c.turno][i]++});
      if(sun)g[dom]='D';
    };
    const av0=S.avisos.length;let melhor=null,pen0=1e9;
    for(let t=0;t<(only?1:300);t++){ // testa várias ordens e fica com a que respeita melhor os limites por dia
      resetSem();S.avisos.length=av0;ordem(t).forEach(atribui);
      const pen=excesso()+(S.avisos.length-av0)*50;
      if(pen<pen0){pen0=pen;melhor={g:alvo.map(c=>[c.id,Array.from({length:7},(_,i)=>S.grid[c.id][add(seg,i)])]),av:S.avisos.slice(av0)}}
      if(pen===0)break}
    resetSem();S.avisos.length=av0;

function invSelecionar(P,cfg,usados,seed){
  const g=id=>(P.grid||{})[id]||{},D=cfg.data,N=add(D,1);

  const trab=(c,d)=>!g(c.id)[d],nIn=N<=fim; // trabalha no dia d (não está de F nem de DSR)
  const cnt={};(usados||[]).forEach(id=>cnt[id]=(cnt[id]||0)+1);

  const esc=colabs.filter(c=>c.cargo==='Encarregado'),ja=new Set();
  turnos.forEach(([t,n])=>{
    const pool=colabs.filter(c=>c.cargo!=='Encarregado'&&c.turno===t&&trab(c,D));
    if(pool.length<n){falta.push(t+': precisa de '+n+' e há '+pool.length+' disponível(is)');}
    const tot=colabs.filter(c=>c.cargo!=='Encarregado'&&c.turno===t&&trab(c,D)).length;
    // quem NÃO trabalha no dia seguinte é preferido; depois, quem foi menos convocado; seed varia o desempate
    const sc=c=>(nIn&&trab(c,N)?10:0)+(cnt[c.id]||0)*3+rnd()*4;
    pool.sort((a,b)=>sc(a)-sc(b)).slice(0,n).forEach(c=>{part.push({id:c.id,nome:c.nome,turno:t,cargo:c.cargo});ja.add(c.id)});
    if(pool.length>=n&&tot-n<1)av.push('Atenção: no '+t+' sobrariam '+(tot-n)+' colaborador(es) da equipe normal no dia do inventário.');
  });

      body.push([{content:x,colSpan:dk.length+1,styles:{fillColor:[13,126,164],textColor:255,halign:'left',fontStyle:'bold'}}]);
      cs.forEach(c=>body.push([nomeColab(c)+(c.cargo==='Encarregado'?' *':''),...dk.map(d=>{const v=marca(c,d);return v==='D'?'DSR':v})]))});
    doc.autoTable({startY:14,head:[['Colaborador',...dk.map(d=>NOMES[(dt(d).getDay()+6)%7]+'\n'+br(d)+(dt(d).getDay()===1&&isInv(d)?'\nINV':''))]],body,theme:'grid',
      styles:{fontSize:8.5,cellPadding:1.8,halign:'center',valign:'middle',lineWidth:.15},headStyles:{fillColor:[236,241,244],textColor:30,fontSize:8},columnStyles:{0:{halign:'left',cellWidth:48}},
      didParseCell:h=>{if(h.section==='body'&&h.column.index>0){const v=h.cell.raw;if(v==='F')h.cell.styles.fillColor=[253,230,138];if(v==='T')h.cell.styles.fillColor=[144,202,249];if(v==='DSR'){h.cell.styles.fillColor=[187,247,208];h.cell.styles.fontStyle='bold'}}}});
    doc.setFontSize(7);doc.text('F = folga da semana   DSR = folga de domingo   * encarregado   INV = inventário',10,doc.internal.pageSize.getHeight()-6)}
  entrega(doc.output('blob'),'escala-5x2-'+S.inicio+'.pdf',share)}
function shareApp(){const u=location.href.split('?')[0].split('#')[0],t='Escala 5x2 FLV';
  if(navigator.share)navigator.share({title:t,text:t+' – app de escala de folgas',url:u}).catch(()=>{});
  else window.open('https://wa.me/?text='+encodeURIComponent(t+'\n'+u),'_blank')}
function valUlt(nome,u,d,pd){
  if(u&&dt(u).getDay()===0)return nome+': a última folga da semana não pode ser domingo. Use o campo do DSR.';
  if(d&&dt(d).getDay()!==0)return nome+': o último DSR precisa ser num domingo.';
  for(const x of [u,d])if(x&&diff(x,START)>=0)return nome+': as datas precisam ser antes de '+br(START)+'.';
  if(d&&pd&&diff(pd,d)<14)return nome+': o primeiro DSR ('+br(pd)+') está colado no último DSR ('+br(d)+'). Entre dois DSR precisa haver pelo menos 14 dias.';
  return ''}
function ults(){M(`<h3>🗓️ Antes de ${br(START)}</h3><small>Para cada pessoa, informe a última folga da semana (segunda a sábado) e o último DSR (domingo) antes do início. O app usa a mais recente nas primeiras semanas para não passar de 5 dias seguidos, e confere se o primeiro DSR não fica colado no último.</small>`+S.colabs.slice().sort((a,b)=>a.turno.localeCompare(b.turno)||ord(a,b)).map(c=>`<div class="li" style="display:block"><b>${esc(c.nome)}</b>${c.cargo==='Encarregado'?' ★':''} <small>${c.turno}</small><div class="row"><div style="flex:1"><label>Última folga da semana</label><input type="date" id="u_${c.id}" value="${c.ult||''}"></div><div style="flex:1"><label>Último DSR (domingo)</label><input type="date" id="d_${c.id}" value="${c.ultd||''}"></div></div></div>`).join('')+'<div class="row"><button onclick="salvaUlt()">✔ Salvar</button></div>')}
function salvaUlt(){const v=g$;
  for(const c of S.colabs){const u=v('u_'+c.id),d=v('d_'+c.id);if(!u)continue;const er=valUlt(c.nome,u.value,d.value,c.pd);if(er){alert(er);return}}
  S.colabs.forEach(c=>{const u=v('u_'+c.id),d=v('d_'+c.id);if(u){c.ult=u.value;c.ultd=d.value}});save();fm();render()}
function mesSemanas(v){let k=Math.ceil(diff(v+'-01',START)/28);if(k<0)k=0;return{inicio:add(START,28*k),semanas:4}}
function setMes(v){if(!v)return;const r=mesSemanas(v);
  if(!r){alert('Não foi possível encontrar o ciclo de 4 semanas.');render();return}
  if(r.inicio!==S.inicio){arquivaAtual();S.inicio=r.inicio;S.semanas=r.semanas;S.grid={};S.avisos=[]}SV=-2;fb();save();render()}
function domTela(){const r=refDom();
  const lin=c=>{const st=domSel(c);return `<div class="li"><span>${esc(c.nome)}${c.cargo==='Encarregado'?' ★':''}</span><span><button class="${st==='trab'?'':'sec'}" onclick="setDom('${c.id}','trab')">Trabalha</button> <button class="${st==='dsr'?'':'sec'}" onclick="setDom('${c.id}','dsr')">DSR</button></span></div>`};
  const sec=t=>{const cs=S.colabs.filter(c=>c.turno===t).sort(ord);if(!cs.length)return'';return `<h4>${t} · DSR ${cs.filter(c=>domSel(c)==='dsr').length} · Trabalha ${cs.filter(c=>domSel(c)==='trab').length}</h4>`+cs.map(lin).join('')};
  M(`<h3>📅 Domingo ${br(r)}</h3><small>Marque quem trabalha e quem fica de DSR. Em ${br(add(r,7))} o app inverte, e assim por diante. Toque de novo no botão para limpar.</small>`+sec('Abertura')+sec('Fechamento'))}
function setDom(id,v){const c=pes(id),n=domSel(c)===v?'':v,pd=domPd(n),o=confEnc({...c,pd});
  if(o){alert(msgEnc(c,o));return}
  const er=valUlt(c.nome,c.ult,c.ultd,pd);if(er){alert(er);return}
  c.pd=pd;c.prov=false;if(!pd)delete S.grid[id];save();
  if(pd&&Object.keys(S.grid[id]||{}).length)gerar(id);
  domTela();render()}
const fb=()=>{const b=g$('bar');if(b)b.remove()};
function posGerar(){fb();const b=document.createElement('div');b.id='bar';b.className='bar no';
  b.innerHTML=`<b>✅ Escala gerada</b> <small>Confira a tabela acima. Os domingos não mudam.</small><div class="row"><button onclick="fb()">✔ Manter</button><button class="sec" onclick="S.seed++;fb();gerarLoad(null,1)">🔄 Outra (só dias da semana)</button>${S.prev&&S.prev!=='{}'?'<button class="sec" onclick="volta()">↩️ Anterior</button>':''}</div>`;
  document.body.appendChild(b);
  const w=document.querySelector('.w');if(w&&w.scrollIntoView)w.scrollIntoView({behavior:'smooth'})}
function volta(){S.grid=JSON.parse(S.prev);S.prev='';save();fb();render()}
function render(){
  if(INV){rInv();return}
  const nav=document.querySelector('nav'),sr=g$('sr');if(sr)sr.style.display=ENTROU?'':'none';if(!ENTROU){const t=g$('tituloApp'),sb=g$('subtituloApp');if(t)t.textContent='🥬 Escala 5x2';if(sb)sb.textContent='Escolha seu perfil para entrar';document.getElementById('app').innerHTML=S.perfilTemp?vInicio():vEntrada();if(nav)nav.style.display='none';return}if(nav)nav.style.display='flex';document.getElementById('app').innerHTML=S.tab==='equipe'?vEquipe():vEscala();aplicaIdentidade();document.getElementById('b1').className=S.tab==='escala'?'on':'sec';document.getElementById('b2').className=S.tab==='equipe'?'on':'sec'}
function escuro(){return S.tema==='dark'||(!S.tema&&matchMedia('(prefers-color-scheme:dark)').matches)}
function aplicaTema(){const r=document.documentElement;S.tema?r.setAttribute('data-t',S.tema):r.removeAttribute('data-t');document.getElementById('tm').textContent=escuro()?'☀️':'🌙'}
function tema(){S.tema=escuro()?'light':'dark';save();aplicaTema()}
function migrarLegado(){
  if((S.historico||[]).length||S.inicio<=START)return;
  const r={inicio:START,semanas:4,inv:S.inv||'',colabs:JSON.parse(JSON.stringify(S.colabs)),grid:{}};let achou=false;
  Object.entries(S.grid||{}).forEach(([id,g])=>{Object.entries(g||{}).forEach(([d,v])=>{if(d>=START&&d<S.inicio){r.grid[id]=r.grid[id]||{};r.grid[id][d]=v;achou=true}})});
  if(achou){S.historico.push(r);save()}
}
render();aplicaTema();try{if(!localStorage.getItem(TUTK)){localStorage.setItem(TUTK,'1');tut(0)}}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
checaVersao();document.addEventListener('visibilitychange',()=>{if(!document.hidden)checaVersao()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
